<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Organograma — Antes e Depois · Vendemmia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;overflow:hidden}

.toggle-bar{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(115deg,#2E1F54 0%,#422C75 55%,#4E3392 100%);
  padding:12px 16px;
  box-shadow:0 4px 18px rgba(46,31,84,.25);
  position:relative;z-index:10;
}
.toggle-label{color:#FFFCF8;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.65;margin-right:6px}
.toggle-group{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:4px}
.toggle-btn{
  border:none;cursor:pointer;background:transparent;color:#FFFCF8;
  font-size:13px;font-weight:700;padding:9px 22px;border-radius:999px;
  transition:background .18s,color .18s;opacity:.7;white-space:nowrap;
}
.toggle-btn:hover{opacity:1}
.toggle-btn.active{background:#FF2F69;opacity:1;box-shadow:0 3px 10px rgba(255,47,105,.4)}

.frames-wrap{position:relative;width:100%;height:calc(100vh - 56px)}
.compare-frame{
  position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;
  opacity:1;transition:opacity .15s;
}
.compare-frame.hidden{opacity:0;pointer-events:none;visibility:hidden}

@media (max-width:480px){
  .toggle-label{display:none}
  .toggle-btn{padding:8px 16px;font-size:12px}
}
</style>
</head>
<body>

<div class="toggle-bar">
  <span class="toggle-label">Organograma</span>
  <div class="toggle-group">
    <button class="toggle-btn active" id="btn-antes" type="button">Antes</button>
    <button class="toggle-btn" id="btn-depois" type="button">Depois</button>
  </div>
</div>

<div class="frames-wrap">
  <iframe class="compare-frame" id="frame-antes" src="as-is.html" title="Estrutura anterior"></iframe>
  <iframe class="compare-frame hidden" id="frame-depois" src="to-be.html" title="Nova estrutura" loading="lazy"></iframe>
</div>

<script>
const btnAntes = document.getElementById('btn-antes');
const btnDepois = document.getElementById('btn-depois');
const frameAntes = document.getElementById('frame-antes');
const frameDepois = document.getElementById('frame-depois');

function showAntes(){
  frameAntes.classList.remove('hidden');
  frameDepois.classList.add('hidden');
  btnAntes.classList.add('active');
  btnDepois.classList.remove('active');
}
function showDepois(){
  frameDepois.classList.remove('hidden');
  frameAntes.classList.add('hidden');
  btnDepois.classList.add('active');
  btnAntes.classList.remove('active');
}
btnAntes.addEventListener('click', showAntes);
btnDepois.addEventListener('click', showDepois);
</script>
</body>
</html>
