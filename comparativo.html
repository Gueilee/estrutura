<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Organograma — Antes e Depois · Vendemmia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;overflow:hidden}

.toggle-bar{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(115deg,#2E1F54 0%,#422C75 55%,#4E3392 100%);
  padding:12px 16px;
  box-shadow:0 4px 18px rgba(46,31,84,.25);
  position:relative;z-index:10;
}
.toggle-label{color:#FFFCF8;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.65;margin-right:6px}
.toggle-group{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:4px}
.toggle-btn{
  border:none;cursor:pointer;background:transparent;color:#FFFCF8;
  font-size:13px;font-weight:700;padding:9px 22px;border-radius:999px;
  transition:background .18s,color .18s;opacity:.7;white-space:nowrap;
}
.toggle-btn:hover{opacity:1}
.toggle-btn.active{background:#FF2F69;opacity:1;box-shadow:0 3px 10px rgba(255,47,105,.4)}

.compare-fs-btn{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  color:#FFFCF8;font-size:11.5px;font-weight:600;
  padding:9px 14px;border-radius:10px;cursor:pointer;
  transition:background .15s;white-space:nowrap;
}
.compare-fs-btn:hover{background:rgba(255,255,255,.2)}
.compare-fs-btn svg{width:14px;height:14px;flex-shrink:0}

.frames-wrap{position:relative;width:100%;height:calc(100vh - 56px)}
.compare-frame{
  position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;
  opacity:1;transition:opacity .15s;
}
.compare-frame.hidden{opacity:0;pointer-events:none;visibility:hidden}

@media (max-width:700px){
  .compare-fs-btn span{display:none}
  .compare-fs-btn{padding:9px}
}
@media (max-width:480px){
  .toggle-label{display:none}
  .toggle-btn{padding:8px 16px;font-size:12px}
}
</style>
</head>
<body>

<div class="toggle-bar">
  <span class="toggle-label">Organograma</span>
  <div class="toggle-group">
    <button class="toggle-btn active" id="btn-antes" type="button">Antes</button>
    <button class="toggle-btn" id="btn-depois" type="button">Depois</button>
  </div>
  <button class="compare-fs-btn" id="compareFsBtn" type="button">
    <svg id="compareFsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <span id="compareFsLabel">Tela cheia</span>
  </button>
</div>

<div class="frames-wrap">
  <iframe class="compare-frame" id="frame-antes" src="as-is.html" title="Estrutura anterior"></iframe>
  <iframe class="compare-frame hidden" id="frame-depois" src="to-be.html" title="Nova estrutura" loading="lazy"></iframe>
</div>

<script>
const btnAntes = document.getElementById('btn-antes');
const btnDepois = document.getElementById('btn-depois');
const frameAntes = document.getElementById('frame-antes');
const frameDepois = document.getElementById('frame-depois');

function showAntes(){
  frameAntes.classList.remove('hidden');
  frameDepois.classList.add('hidden');
  btnAntes.classList.add('active');
  btnDepois.classList.remove('active');
}
function showDepois(){
  frameDepois.classList.remove('hidden');
  frameAntes.classList.add('hidden');
  btnDepois.classList.add('active');
  btnAntes.classList.remove('active');
}
btnAntes.addEventListener('click', showAntes);
btnDepois.addEventListener('click', showDepois);

/* ===== Tela cheia (fullscreena a página inteira, barra incluída) ===== */
const compareFsBtn = document.getElementById('compareFsBtn');
compareFsBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', ()=>{
  const label = document.getElementById('compareFsLabel');
  const icon = document.getElementById('compareFsIcon');
  if(document.fullscreenElement){
    label.textContent = 'Sair da tela cheia';
    icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
  } else {
    label.textContent = 'Tela cheia';
    icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
  }
});
</script>
</body>
</html>
